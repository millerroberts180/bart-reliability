# Local prediction API in historical-replay mode (docs/local_api.md). Local only:
# it binds to the loopback interface and has no authentication. Every key is required.

# Historical "as of" time (UTC). The API answers as if it were this moment: features,
# history and alerts use only what had been collected by then. 2026-10-15 was not used
# for training, validation or testing.
as_of = "2026-10-15T17:00:00Z"

# Ignored local inputs. The warehouse must cover as_of (see stale_after_seconds).
warehouse = "data/warehouse/bart.duckdb"
bundle = "data/models/eta_revision_bundle"

# A feed snapshot older than this at as_of is stale (two collector polls; the website
# uses the same limit).
stale_after_seconds = 120

# Feed history loaded before as_of. Every eligible trip-stop history in the development
# snapshot spans at most 2.7 h, so 6 h always reaches its first listing.
history_lookback_seconds = 21600

# Stability classes, identical to web/src/domain/eta.ts (STABILITY_CUTOFFS).
stability_may_be_revised = 0.25
stability_likely_to_be_revised = 0.5

host = "127.0.0.1"
port = 8000
