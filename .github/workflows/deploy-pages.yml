name: Deploy website

# Publishes the static historical-replay build of web/ to GitHub Pages: the page reads the
# replay tracked under web/public/replay/ as same-origin static files (docs/static_replay.md).
# No API is deployed, and the build carries no API address. It deploys only after a push to main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A queued run waits for the one in progress, which is never
# cancelled part-way through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      # Offline: no warehouse, model bundle or API. Refuses a damaged or inconsistent replay.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Check the published replay
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps -e .
          python -m pip install 'pydantic>=2.6'
          bart-static-replay check web/public/replay

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Build (static historical replay)
        run: npm run build
        env:
          VITE_DATA_MODE: static
          VITE_BASE_PATH: /bart-reliability/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist/

  deploy:
    name: Deploy
    needs: build
    # Only a push to main deploys. A manual run, from any branch including main, checks and
    # builds but never deploys.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
