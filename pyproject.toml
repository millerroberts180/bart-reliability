[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bart-reliability"
version = "0.1.0"
description = "Measure the accuracy of BART real-time arrival predictions."
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "gtfs-realtime-bindings>=1.0",
    "pyarrow>=15",
    "pytz>=2024.1",
    "requests>=2.31",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "responses>=0.25",
    "ruff>=0.6",
]

[project.scripts]
bart-collect = "bart_reliability.collector.main:main"
bart-transform = "bart_reliability.transform.main:main"
bart-build-warehouse = "bart_reliability.warehouse.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
