[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bart-reliability"
version = "0.1.0"
description = "Measure how BART real-time arrival estimates are revised as trains approach."
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "gtfs-realtime-bindings>=1.0",
    "pyarrow>=15",
    "pytz>=2024.1",
    "requests>=2.31",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "responses>=0.25",
    "ruff>=0.6",
]
# ETA revision models (bart-eta-model). Kept optional so the collector stays small.
model = [
    "pandas>=2.2",
    "scikit-learn>=1.5",
]
# Local prediction API (bart-serve-local). Optional, like the model extra.
serve = [
    "fastapi>=0.110",
    "pydantic>=2.6",
    "uvicorn>=0.29",
]

[project.scripts]
bart-collect = "bart_reliability.collector.main:main"
bart-transform = "bart_reliability.transform.main:main"
bart-build-warehouse = "bart_reliability.warehouse.main:main"
bart-eta-sensitivity = "bart_reliability.warehouse.eta_revision_sensitivity:main"
bart-alert-sensitivity = "bart_reliability.warehouse.alerts:staleness_main"
bart-511-download = "bart_reliability.open511.download:main"
bart-511-audit = "bart_reliability.open511.audit:main"
bart-eta-model = "bart_reliability.modeling.main:main"
bart-eta-bundle = "bart_reliability.serving.main:main"
bart-serve-local = "bart_reliability.api.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
